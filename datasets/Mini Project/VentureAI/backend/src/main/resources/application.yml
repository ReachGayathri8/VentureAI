server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: venture-ai-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ventureai}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:1yzHFYfUi_ZJql9Cu-qdijeBUAhlklKkjEdCzDTDUNKsPZX8LNqOA34ip-jUb2tz}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  ml-service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8001}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    enabled: ${GEMINI_ENABLED:true}

  reports:
    storage-dir: ${REPORTS_STORAGE_DIR:./reports}

logging:
  level:
    com.ventureai: ${LOG_LEVEL:INFO}

